[package]
name = "honba-kao-api-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM compute surface for Honba frontend (wasm32-unknown-unknown)"

[lib]
name = "honba_api_wasm"
crate-type = ["cdylib", "rlib"]

[features]
# The `wasm-bindgen` JS facade (the exports in `src/lib.rs`). On by default so `wasm-pack` builds
# for external JS callers are unchanged; Rust callers in the workspace turn it off and use the
# typed module APIs.
default = ["js"]
js = ["dep:wasm-bindgen"]

[dependencies]
honba-api.workspace = true
honba-core.workspace = true
honba-indicators.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
