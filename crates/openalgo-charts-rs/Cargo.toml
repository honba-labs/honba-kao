[package]
name = "openalgo-charts-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Honba Labs <dev@honba.io>"]
license = "Apache-2.0"
description = "High-performance Rust bindings and reactive Leptos/Dioxus components for OpenAlgo Charts (TradingView Lightweight Charts fork)"
readme = "README.md"
repository = "https://github.com/dev-pmallapp/openalgo-charts-rs"
homepage = "https://github.com/dev-pmallapp/openalgo-charts-rs"
documentation = "https://docs.rs/openalgo-charts-rs"
keywords = ["charts", "trading", "lightweight-charts", "leptos", "dioxus"]
categories = ["web-programming", "gui", "visualization"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
name = "openalgo_charts"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"], optional = true }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "CustomEvent",
    "Event",
    "EventTarget",
    "CssStyleDeclaration",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
thiserror = "1.0"
tracing = { version = "0.1", optional = true }

[features]
default = ["leptos", "tracing"]
leptos = ["dep:leptos"]
tracing = ["dep:tracing"]

[dev-dependencies]
console_error_panic_hook = "0.1"

[package.metadata.docs.rs]
all-features = true
targets = ["wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
