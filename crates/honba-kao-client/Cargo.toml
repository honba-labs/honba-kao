[package]
name = "honba-kao-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gloo-net.workspace = true
serde.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
futures-channel.workspace = true
sha2.workspace = true
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "WebSocket", "BinaryType", "Window", "CloseEvent"] }
serde_json.workspace = true
thiserror.workspace = true
honba-core.workspace = true
honba-api.workspace = true
honba-analytics.workspace = true

# uuid / getrandom are pulled in transitively (via honba-core) and must use
# the `js` entropy source when compiling to `wasm32-unknown-unknown`. Declaring
# them here with `features = ["js"]` unifies the feature resolution so the WASM
# target compiles cleanly.
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
