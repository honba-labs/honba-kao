[package]
name = "openalgo-charts-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance Rust bindings and reactive Leptos components for charts"

[lib]
name = "openalgo_charts"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"], optional = true }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Node",
    "DomRect",
    "MouseEvent",
    "CustomEvent",
    "Event",
    "EventTarget",
    "CssStyleDeclaration",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
thiserror = "1.0"
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
tracing = { version = "0.1", optional = true }

[features]
default = ["leptos", "tracing"]
leptos = ["dep:leptos"]
tracing = ["dep:tracing"]
