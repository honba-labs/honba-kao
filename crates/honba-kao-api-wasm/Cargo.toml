[package]
name = "honba-kao-api-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM compute surface for Honba frontend"

[lib]
name = "honba_api_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = []
js = ["dep:wasm-bindgen"]

[dependencies]
honba-api.workspace = true
honba-core.workspace = true
honba-indicators.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
