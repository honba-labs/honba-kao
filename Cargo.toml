[workspace]
resolver = "2"
members = [
  "crates/honba-kao-app",
  "crates/honba-kao-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-kao"

[workspace.dependencies]
leptos = { version = "0.7", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rust_decimal = "1"

honba-kokoro-types = { path = "../honba-kokoro/crates/honba-kokoro-types" }
honba-kao-client   = { path = "crates/honba-kao-client" }
