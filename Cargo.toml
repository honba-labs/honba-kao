[workspace]
resolver = "2"
members = [
  "crates/honba-kao-api-wasm",
  "crates/honba-kao-app",
  "crates/honba-kao-client",
  "crates/honba-kao-ui-core",
  "crates/openalgo-charts-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/honba-labs/honba-kao"

[workspace.dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"

honba-kao-api-wasm = { path = "crates/honba-kao-api-wasm" }
honba-kao-app      = { path = "crates/honba-kao-app" }
honba-kao-client   = { path = "crates/honba-kao-client" }
honba-kao-ui-core  = { path = "crates/honba-kao-ui-core" }
openalgo-charts    = { package = "openalgo-charts-rs", path = "crates/openalgo-charts-rs" }

honba-api-wasm     = { package = "honba-kao-api-wasm", path = "crates/honba-kao-api-wasm" }
honba-messages     = { package = "honba-kokoro-messages", path = "../honba-kokoro/crates/honba-kokoro-messages" }
honba-entities     = { package = "honba-kokoro-entities", path = "../honba-kokoro/crates/honba-kokoro-entities" }
honba-api          = { package = "honba-ya-api", path = "../honba-ya/crates/honba-ya-api" }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing = "0.1"
thiserror = "1"
honba-kokoro-types = { path = "../honba-kokoro/crates/honba-kokoro-types" }
honba-engine       = { package = "honba-ya-engine", path = "../honba-ya/crates/honba-ya-engine" }
honba-indicators   = { package = "honba-me-indicators", path = "../honba-me/crates/honba-me-indicators" }
honba-analytics    = { package = "honba-nou-analytics", path = "../honba-nou/crates/honba-nou-analytics" }

[profile.dev]
opt-level = 1

# Production tuning. `trunk build --release` selects cargo's `release` profile,
# so the settings live here; `prod` mirrors them for `cargo check --profile prod`.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.prod]
inherits = "release"
