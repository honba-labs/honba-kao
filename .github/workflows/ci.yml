name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# honba-kao's Cargo workspace has path dependencies on sibling Honba repos
# (`../honba-core`, `../honba-ya`, `../honba-me`, `../honba-nou`; see the root
# Cargo.toml). Jobs that compile Rust therefore check this repo out into
# `honba-kao/` and the siblings next to it at their default branch, mirroring
# the local honba-workspace layout.

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14
  BINARYEN_VERSION: version_119

jobs:
  # AGENTS.md §7.1 Rust gates. Each step runs even if an earlier one failed so
  # every gate reports its own status.
  check-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: honba-kao
    steps:
      - name: Checkout honba-kao
        uses: actions/checkout@v4
        with:
          path: honba-kao

      - name: Checkout sibling repos (path dependencies)
        run: |
          for repo in honba-core honba-ya honba-me honba-nou; do
            git clone --depth 1 "https://github.com/honba-labs/${repo}.git" "../${repo}"
          done

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: honba-kao -> target

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linting
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        if: ${{ !cancelled() }}
        run: cargo test --all --release

  # Static source checks; no Rust toolchain needed.
  static-lints:
    name: Design System & a11y Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Design system lint (no raw <button>/<input>)
        run: make lint-design-system

      - name: Accessibility lint
        if: ${{ !cancelled() }}
        run: make lint-a11y

  # DoD #7: optimized trunk release build, performance gate and Playwright E2E
  # against the built app.
  web-build:
    name: Trunk Build, Performance & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: honba-kao
    steps:
      - name: Checkout honba-kao
        uses: actions/checkout@v4
        with:
          path: honba-kao

      - name: Checkout sibling repos (path dependencies)
        run: |
          for repo in honba-core honba-ya honba-me honba-nou; do
            git clone --depth 1 "https://github.com/honba-labs/${repo}.git" "../${repo}"
          done

      - name: Setup Rust toolchain (+ wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: honba-kao -> target

      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Trunk release build
        id: build
        run: trunk build --release

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: honba-kao-dist
          path: honba-kao/dist
          retention-days: 7

      - name: Performance verification
        run: bash scripts/check-performance.sh

      - name: Setup Node
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: honba-kao/e2e/package-lock.json

      - name: Install Playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: honba-kao/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts `trunk serve --release` (cache hit on the
      # build above) as its webServer.
      - name: Playwright E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: honba-kao/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            honba-kao/e2e/playwright-report
            honba-kao/e2e/test-results
          retention-days: 7
