[workspace]
resolver = "2"
members = [
  "crates/honba-kao-api-wasm",
  "crates/honba-kao-app",
  "crates/honba-kao-client",
  "crates/honba-kao-ui-core",
  "crates/openalgo-charts-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/honba-labs/honba-kao"

[workspace.dependencies]
# NSH (Native Shell) — port target per honba-kao/nsh-port.md.
# nsh-core / nsh-base are Apache-2.0, v0.3.0, published 2026-10-26.
nsh-core = "0.3.0"
nsh-base = "0.3.0"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
urlencoding = "2"

honba-kao-api-wasm = { path = "crates/honba-kao-api-wasm", default-features = false }
honba-kao-app      = { path = "crates/honba-kao-app" }
honba-kao-client   = { path = "crates/honba-kao-client" }
honba-kao-ui-core  = { path = "crates/honba-kao-ui-core" }
openalgo-charts    = { package = "openalgo-charts-rs", path = "crates/openalgo-charts-rs" }

honba-api-wasm     = { package = "honba-kao-api-wasm", path = "crates/honba-kao-api-wasm" }
honba-core         = { path = "../honba-core" }
honba-api          = { package = "honba-ya-api", path = "../honba-ya/crates/honba-ya-api" }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing = "0.1"
thiserror = "1"
honba-indicators   = { package = "honba-me-indicators", path = "../honba-me/crates/honba-me-indicators" }
honba-analytics    = { package = "honba-nou-analytics", path = "../honba-nou/crates/honba-nou-analytics" }

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

# Production tuning. `trunk build --release` selects cargo's `release` profile,
# so the settings live here; `prod` mirrors them for `cargo check --profile prod`.

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.prod]
inherits = "release"
