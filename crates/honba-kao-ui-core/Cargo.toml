[package]
name = "honba-kao-ui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "honba_kao_ui_core"

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "Node", "Event", "EventTarget",
    "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "Location",
    "MouseEvent", "KeyboardEvent", "FocusEvent", "SubmitEvent",
    "SvgElement", "SvgsvgElement", "SvgPathElement",
    "MediaQueryList", "Storage", "WebSocket", "MessageEvent", "ResizeObserver",
    "DomRect",
] }
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
num-traits = "0.2"
honba-kao-api-wasm.workspace = true
